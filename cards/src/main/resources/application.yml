  h2:
    console:
      enabled: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
  config:
    import:
      - "applicaton-qa.yml"
      - "appliction-prod.yml"
  profiles:
    active:
      - qa


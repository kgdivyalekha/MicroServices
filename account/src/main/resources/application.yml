server:
  port: 8080
spring:
  application:
    name: "account"
  profiles:
    active: "prod"
  datasource:
    url: jdbc:mysql://localhost:3306/accountdb
    username: root
    password: system

  jpa:
    show-sql: true
  sql:
    init:
      mode: always
  config:
    import: "optional:configserver:http://localhost:8071/"


management:
  endpoints:
    web:
      exposure:
        include: "*"